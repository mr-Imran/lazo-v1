                     .join('')}</tbody></table></div></section>`
                : `<div class="empty"><h3>Nothing to review</h3><p>New and edited venues and products appear here.</p></div>`;
            },

            async promos() {
              const { promotions } = await api('/admin/vendor-promotions');
              return promotions.length
                ? `<section class="panel"><h2>Promotions</h2><p class="sub">${promotions.filter((p) => p.status === 'requested').length} requested · ${promotions.filter((p) => p.live).length} live.</p>
                   <div class="table-wrap"><table>
                   <thead><tr><th>Listing</th><th>Vendor</th><th>Length</th><th>Status</th><th>Runs</th><th></th></tr></thead>
                   <tbody>${promotions
                     .map(
                       (p) => `<tr>
                         <td><span class="name">${esc(p.listingName || 'Deleted listing')}</span> <span class="pill pill-type">${p.listingType === 'location' ? 'Venue' : 'Product'}</span>
                           ${p.message ? `<br /><span class="details-line">“${esc(p.message)}”</span>` : ''}</td>
                         <td>${esc(p.vendorName)}</td>
                         <td>${p.days} days</td>
                         <td>${p.live ? '<span class="pill pill-ok">Live</span>' : `<span class="pill pill-muted">${esc(p.status)}</span>`}</td>
                         <td class="muted">${p.startsAt ? `${esc(date(p.startsAt))} – ${esc(date(p.endsAt))}` : '—'}</td>
                         <td style="white-space:nowrap">${
                           p.status === 'requested'
                             ? `<button class="link" data-p="approve" data-id="${esc(p.id)}">Approve</button>
                                &nbsp;<button class="link danger" data-p="reject" data-id="${esc(p.id)}">Reject</button>`
                             : p.live
                               ? `<button class="link danger" data-p="end" data-id="${esc(p.id)}">End now</button>`
                               : ''
                         }</td></tr>`,
                     )
                     .join('')}</tbody></table></div></section>`
                : `<div class="empty"><h3>No promotion requests</h3><p>Vendors request promotions from their dashboard.</p></div>`;
            },

            async all() {
              const { vendors } = await api('/admin/vendors');
              return vendors.length
                ? `<section class="panel"><h2>All vendors</h2><p class="sub">${vendors.filter((v) => v.status === 'active').length} approved of ${vendors.length}.</p>
                   <div class="table-wrap"><table>
                   <thead><tr><th>Business</th><th>Category</th><th>City</th><th>Status</th><th>Listings</th><th>Host picks</th><th></th></tr></thead>
                   <tbody>${vendors
                     .map(
                       (v) => `<tr>
                         <td><span class="name">${esc(v.businessName)}</span>${v.reviewNote ? `<br /><span class="details-line">Note: ${esc(v.reviewNote)}</span>` : ''}</td>
                         <td>${esc(DEPARTMENT_LABELS[v.department] ?? v.department)}</td>
                         <td class="muted">${esc(v.city)}</td>
                         <td>${vendorPill(v.status)}</td>
                         <td class="muted">${v.locations} loc · ${v.products} prod${v.pendingListings ? ` · <b>${v.pendingListings} to review</b>` : ''}</td>
                         <td>${v.selections}</td>
                         <td style="white-space:nowrap">${
                           v.status === 'active'
                             ? `<button class="link danger" data-v="pause" data-id="${esc(v.id)}">Pause</button>`
                             : v.status === 'paused'
                               ? `<button class="link" data-v="activate" data-id="${esc(v.id)}">Reactivate</button>`
                               : v.status === 'pending_approval'
                                 ? `<button class="link" data-v="approve" data-id="${esc(v.id)}">Approve</button>
                                    &nbsp;<button class="link danger" data-v="reject" data-id="${esc(v.id)}">Reject</button>`
                                 : ''
                         }</td></tr>`,
                     )
                     .join('')}</tbody></table></div></section>`
                : `<div class="empty"><h3>No vendors yet</h3><p>Vendors sign up from “For vendors” in the app.</p></div>`;
            },
          };

          const show = async (key) => {
            current = key;
            for (const b of body.querySelectorAll('[data-tab]')) b.setAttribute('aria-pressed', String(b.dataset.tab === key));
            panel.innerHTML = '<div class="spinner" role="status" aria-label="Loading"></div>';
            try {
              // Own products has a form with its own listeners, so it renders into a fresh node.
              if (key === 'own') {
                const own = document.createElement('div');
                await OwnProducts(own);
                panel.replaceChildren(own);
              } else {
                panel.replaceChildren(el(await views[key]()));
              }
            } catch (failure) {
              panel.replaceChildren(el(migrationNote(failure)));
            }
            counts().catch(() => {});
          };

          body.querySelector('.subtabs').addEventListener('click', (e) => {
            const b = e.target.closest('[data-tab]');
            if (b) show(b.dataset.tab);
          });

          panel.addEventListener('click', async (e) => {
            const b = e.target.closest('button[data-v], button[data-l], button[data-p]');
            if (!b) return;
            try {
              if (b.dataset.v) {
                const action = b.dataset.v;
                const note = askNote(`${action[0].toUpperCase()}${action.slice(1)} this vendor — note`, action === 'reject');
                if (note === null) return;
                const v = await api(`/admin/vendors/${b.dataset.id}`, { method: 'PATCH', body: JSON.stringify({ action, note }) });
                toast(`${v.businessName}: ${VENDOR_STATES[v.status]}`);
              } else if (b.dataset.l) {
                const decision = b.dataset.l;
                const note = decision === 'reject' ? askNote('Reason for the vendor', true) : '';
                if (note === null) return;
                await api(`/admin/vendor-listings/${b.dataset.type}/${b.dataset.id}`, { method: 'PATCH', body: JSON.stringify({ decision, note }) });
                toast(decision === 'approve' ? 'Listing approved' : 'Changes requested');
              } else {
                const decision = b.dataset.p;
                const note = decision === 'reject' ? askNote('Reason for the vendor', true) : '';
                if (note === null) return;
                if (decision === 'end' && !confirm('End this promotion now?')) return;
                await api(`/admin/vendor-promotions/${b.dataset.id}`, { method: 'PATCH', body: JSON.stringify({ decision, note }) });
                toast({ approve: 'Promotion is live', reject: 'Promotion declined', end: 'Promotion ended' }[decision]);
              }
              await show(current);
            } catch (failure) {
              toast(failure.message, true);
            }
          });

          await show('apps');
        },
      };

      const Themes = {
        title: 'Themes',
        subtitle: 'The designs hosts pick from in the create flow. Only active themes with an image are shown.',
        async render(body) {
          const { types } = await fetch('/api/event-types').then(async (r) => {
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(data.message ?? `Could not load occasions (${r.status})`);
            return data;
          });
          const labelOf = Object.fromEntries(types.map((t) => [t.value, t.label]));

          body.replaceChildren(
            el(`
            <section class="panel" style="margin-bottom:26px">
              <h2 id="form-title">Add a theme</h2>
              <p class="sub">Upload a card image (JPEG, PNG or WebP, up to 5 MB) or paste an https image URL.</p>
              <form id="theme-form">
                <div class="grid">
                  <div class="field"><label for="t-name">Name</label>
                    <input id="t-name" name="name" maxlength="80" required /></div>
                  <div class="field"><label for="t-slug">Slug</label>
                    <input id="t-slug" name="slug" maxlength="80" pattern="[a-z0-9-]+"
                      title="Lowercase letters, numbers and hyphens. Leave blank to make one from the name." /></div>
                  <div class="field"><label for="t-pos">Position</label>
                    <input id="t-pos" name="position" type="number" min="0" max="100000" value="0" /></div>
                  <div class="field wide"><label for="t-desc">Description</label>
                    <input id="t-desc" name="description" maxlength="200" /></div>
                  <div class="field wide"><label>Occasions (none ticked = every occasion)</label>
                    <div class="checks">${types
                      .map((t) => `<label><input type="checkbox" name="modes" value="${esc(t.value)}" /> ${esc(t.label)}</label>`)
                      .join('')}</div></div>
                  <div class="field"><label for="t-file">Image file</label>
                    <input id="t-file" name="image" type="file" accept="image/jpeg,image/png,image/webp" /></div>
                  <div class="field"><label for="t-url">Or image URL</label>
                    <input id="t-url" name="previewUrl" type="url" /></div>
                  <div class="field"><label>Visibility</label>
                    <div class="checks"><label><input type="checkbox" name="active" checked /> Active</label></div></div>
                </div>
                <div class="foot">
                  <button class="btn btn-primary" id="t-save" type="submit">Add theme</button>
                  <button class="btn btn-ghost" id="t-cancel" type="button" hidden>Cancel</button>
                  <span class="msg" id="t-err" role="alert"></span>
                </div>
              </form>
            </section>
            <div id="list"></div>`),
          );

          const form = body.querySelector('#theme-form');
          const list = body.querySelector('#list');
          const save = body.querySelector('#t-save');
          const cancel = body.querySelector('#t-cancel');
          const err = body.querySelector('#t-err');
          const formTitle = body.querySelector('#form-title');
          let themes = [];
          let editing = null;

          const reset = () => {
            editing = null;
            form.reset();
            formTitle.textContent = 'Add a theme';
            save.textContent = 'Add theme';
            cancel.hidden = true;
            err.textContent = '';
          };

          const edit = (theme) => {
            editing = theme;
            form.reset();
            form.elements.name.value = theme.name;
            form.elements.slug.value = theme.slug;
            form.elements.position.value = theme.position;
            form.elements.description.value = theme.description;
            // An uploaded image stays unless a new file or URL is given.
            form.elements.previewUrl.value = theme.previewUrl.includes('/theme-previews/') ? '' : theme.previewUrl;
            form.elements.active.checked = theme.active;
            for (const box of form.querySelectorAll('input[name="modes"]')) box.checked = theme.modes.includes(box.value);
            formTitle.textContent = `Edit ${theme.name}`;
            save.textContent = 'Save changes';
            cancel.hidden = false;
            err.textContent = '';
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
          };

          const upload = (id, file) => {
            const data = new FormData();
            data.append('image', file);
            return api(`/admin/themes/${id}/image`, { method: 'POST', body: data });
          };

          const status = (t) => (!t.previewUrl ? 'No image' : t.active ? 'Active' : 'Hidden');

          const refresh = async () => {
            try {
              ({ themes } = await api('/admin/themes'));
              list.replaceChildren(
                el(
                  themes.length
                    ? `<section class="panel"><h2>All themes</h2>
                       <p class="sub">${themes.filter((t) => t.active && t.previewUrl).length} of ${themes.length} visible to hosts.</p>
                       <div class="table-wrap"><table>
                        <thead><tr><th></th><th>Theme</th><th>Occasions</th><th>Position</th><th>Status</th><th></th></tr></thead>
                        <tbody>${themes
                          .map(
                            (t) => `<tr>
                              <td>${t.previewUrl ? `<img class="thumb" src="${esc(t.previewUrl)}" alt="" loading="lazy" />` : '<span class="thumb"></span>'}</td>
                              <td><span class="name">${esc(t.name)}</span><br /><code>${esc(t.slug)}</code>
                                ${t.description ? `<br /><span class="muted">${esc(t.description)}</span>` : ''}</td>
                              <td class="muted">${t.modes.length ? t.modes.map((m) => esc(labelOf[m] ?? m)).join(', ') : 'All'}</td>
                              <td class="muted">${t.position}</td>
                              <td><span class="pill ${status(t) === 'Active' ? 'pill-ok' : 'pill-off'}">${status(t)}</span></td>
                              <td style="white-space:nowrap">
                                <button class="link" data-edit="${esc(t.id)}">Edit</button>
                                &nbsp;<button class="link" data-img="${esc(t.id)}">Image</button>
                                &nbsp;<button class="link" data-toggle="${esc(t.id)}">${t.active ? 'Hide' : 'Show'}</button>
                                &nbsp;<button class="link danger" data-del="${esc(t.id)}">Delete</button>
                              </td></tr>`,
                          )
                          .join('')}</tbody></table></div></section>`
                    : `<div class="empty"><h3>No themes yet</h3><p>Add the first one above. Until then hosts see that no themes are available.</p></div>`,
                ),
              );
            } catch (failure) {
              list.replaceChildren(el(`<div class="callout">${esc(failure.message)}</div>`));
            }
          };

          cancel.addEventListener('click', reset);

          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            err.textContent = '';

            const file = form.elements.image.files[0];
            const url = form.elements.previewUrl.value.trim();
            const wantsActive = form.elements.active.checked;
            const fields = {
              name: form.elements.name.value,
              slug: form.elements.slug.value,
              description: form.elements.description.value,
              position: form.elements.position.value,
              modes: [...form.querySelectorAll('input[name="modes"]:checked')].map((b) => b.value),
              ...(url ? { previewUrl: url } : {}),
            };

            if (!editing && !file && !url) {
              err.textContent = 'Add an image file or an image URL.';
              return;
            }

            save.disabled = true;
            try {
              // The row comes first, then its image; it goes live last, once it has one.
              let theme = editing
                ? await api(`/admin/themes/${editing.id}`, { method: 'PATCH', body: JSON.stringify(fields) })
                : await api('/admin/themes', { method: 'POST', body: JSON.stringify({ ...fields, active: false }) });
              if (file) theme = await upload(theme.id, file);
              if (theme.active !== wantsActive) {
                theme = await api(`/admin/themes/${theme.id}`, {
                  method: 'PATCH',
                  body: JSON.stringify({ active: wantsActive }),
                });
              }
              toast(editing ? `Saved ${theme.name}` : `Added ${theme.name}`);
              reset();
            } catch (failure) {
              err.textContent = failure.message;
            } finally {
              save.disabled = false;
              await refresh();
            }
          });

          list.addEventListener('click', async (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const id = btn.dataset.edit ?? btn.dataset.img ?? btn.dataset.toggle ?? btn.dataset.del;
            const theme = themes.find((t) => t.id === id);
            if (!theme) return;

            try {
              if (btn.dataset.edit) {
                edit(theme);
              } else if (btn.dataset.img) {
                const picker = Object.assign(document.createElement('input'), {
                  type: 'file',
                  accept: 'image/jpeg,image/png,image/webp',
                });
                picker.addEventListener('change', async () => {
                  if (!picker.files[0]) return;
                  try {
                    await upload(theme.id, picker.files[0]);
                    toast(`Image updated for ${theme.name}`);
                    await refresh();
                  } catch (failure) {
                    toast(failure.message, true);
                  }
                });
                picker.click();
              } else if (btn.dataset.toggle) {
                await api(`/admin/themes/${theme.id}`, {
                  method: 'PATCH',
                  body: JSON.stringify({ active: !theme.active }),
                });
                toast(theme.active ? `${theme.name} hidden` : `${theme.name} is live`);
                await refresh();
              } else if (btn.dataset.del && confirm(`Delete ${theme.name}? Events that picked it keep their data but lose the theme.`)) {
                await api(`/admin/themes/${theme.id}`, { method: 'DELETE' });
                if (editing?.id === theme.id) reset();
                toast('Theme deleted');
                await refresh();
              }
            } catch (failure) {
              toast(failure.message, true);
            }
          });

          await refresh();
        },
      };

      const Homepage = {
        title: 'Homepage',
        subtitle: 'The occasion cards on lazo’s homepage, and who signed up for the newsletter.',
        async render(body) {
          body.replaceChildren(el(`<div><div id="modes"></div><div id="subs" style="margin-top:26px"></div></div>`));
          const modesEl = body.querySelector('#modes');
          const subsEl = body.querySelector('#subs');
          let modes = [];

          const upload = (value, file) => {
            const data = new FormData();
            data.append('image', file);
            return api(`/admin/event-modes/${value}/image`, { method: 'POST', body: data });
          };

          const refreshModes = async () => {
            try {
              ({ modes } = await api('/admin/event-modes'));
              modesEl.replaceChildren(
                el(`<section class="panel"><h2>Occasion cards</h2>
                  <p class="sub">"Planning an event has never been this easy" shows every active occasion, in position order.
                    A card without an image shows a plain dark card.</p>
                  <div class="table-wrap"><table>
                    <thead><tr><th></th><th>Occasion</th><th>Description</th><th>Position</th><th>Status</th><th></th></tr></thead>
                    <tbody>${modes
                      .map(
                        (m) => `<tr>
                          <td>${m.imageUrl ? `<img class="thumb" src="${esc(m.imageUrl)}" alt="" loading="lazy" />` : '<span class="thumb"></span>'}</td>
                          <td><span class="name">${esc(m.label)}</span><br /><code>${esc(m.value)}</code></td>
                          <td class="muted">${m.description ? esc(m.description) : '—'}</td>
                          <td class="muted">${m.position}</td>
                          <td><span class="pill ${m.active ? 'pill-ok' : 'pill-off'}">${m.active ? 'Active' : 'Hidden'}</span></td>
                          <td style="white-space:nowrap">
                            <button class="link" data-edit="${esc(m.value)}">Edit</button>
                            &nbsp;<button class="link" data-img="${esc(m.value)}">Image</button>
                          </td></tr>`,
                      )
                      .join('')}</tbody></table></div></section>`),
              );
            } catch (failure) {
              modesEl.replaceChildren(el(`<div class="callout">${esc(failure.message)}</div>`));
            }
          };

          const refreshSubs = async () => {
            try {
              const { subscribers } = await api('/admin/newsletter');
              subsEl.replaceChildren(
                el(
                  subscribers.length
                    ? `<section class="panel"><h2>Newsletter sign-ups</h2>
                        <p class="sub">${subscribers.length} from the homepage footer, newest first.</p>
                        <div class="table-wrap"><table>
                          <thead><tr><th>Email</th><th>Source</th><th>Signed up</th></tr></thead>
                          <tbody>${subscribers
                            .map(
                              (s) => `<tr><td>${esc(s.email)}</td><td class="muted">${esc(s.source)}</td>
                                <td class="muted">${esc(new Date(s.createdAt).toLocaleString())}</td></tr>`,
                            )
                            .join('')}</tbody></table></div></section>`
                    : `<div class="empty"><h3>No newsletter sign-ups yet</h3><p>They appear here when someone subscribes in the homepage footer.</p></div>`,
                ),
              );
            } catch (failure) {
              subsEl.replaceChildren(el(migrationNote(failure)));
            }
          };

          modesEl.addEventListener('click', async (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const mode = modes.find((m) => m.value === (btn.dataset.edit ?? btn.dataset.img));
            if (!mode) return;

            try {
              if (btn.dataset.edit) {
                const description = prompt(`Card description for ${mode.label} (up to 200 characters):`, mode.description);
                if (description === null) return;
                await api(`/admin/event-modes/${mode.value}`, { method: 'PATCH', body: JSON.stringify({ description }) });
                toast(`Saved ${mode.label}`);
                await refreshModes();
              } else {
                const picker = Object.assign(document.createElement('input'), {
                  type: 'file',
                  accept: 'image/jpeg,image/png,image/webp',
                });
                picker.addEventListener('change', async () => {
                  if (!picker.files[0]) return;
                  try {
                    await upload(mode.value, picker.files[0]);
                    toast(`Image updated for ${mode.label}`);
                    await refreshModes();
                  } catch (failure) {
                    toast(failure.message, true);
                  }
                });
                picker.click();
              }
            } catch (failure) {
              toast(failure.message, true);
            }
          });

          await Promise.all([refreshModes(), refreshSubs()]);
        },
      };

      const Activity = {
        title: 'Activity',
        subtitle: 'What hosts are doing: guests and RSVPs, registries, planning, vendor quote requests and site views.',
        async render(body) {
          const data = await api('/admin/activity');
          const t = data.totals;
          const tile = (label, value) =>
            `<div class="panel" style="padding:16px 18px"><p class="sub" style="margin:0 0 6px">${esc(label)}</p><p style="margin:0;font-size:24px;font-weight:600">${esc(value)}</p></div>`;
          body.replaceChildren(
            el(`<div>
              ${data.missing.length ? `<div class="callout" style="margin-bottom:18px">Not set up yet (migration pending): ${esc(data.missing.join(', '))}.</div>` : ''}
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px">
                ${tile('Events', t.events)}${tile('Live sites', t.live)}${tile('Invitations', t.households)}
                ${tile('Guests', t.guests)}${tile('Attending answers', t.attending)}${tile('Registry items', t.registryItems)}
                ${tile('Gifts reported', t.gifts)}${tile('Checklist tasks', t.tasks)}${tile('Quote requests', t.quotes)}
                ${tile('Site views', t.views)}
              </div>
              ${
                data.events.length
                  ? `<section class="panel"><h2>By event</h2>
                  <div class="table-wrap"><table>
                    <thead><tr><th>Event</th><th>State</th><th>Views</th><th>Invitations</th><th>Guests</th><th>Attending</th><th>Registry</th><th>Gifts</th><th>Tasks</th><th>Quotes</th></tr></thead>
                    <tbody>${data.events
                      .map(
                        (e) => `<tr>
                          <td><span class="name">${esc(e.name)}</span><br /><code>${esc(e.id)}</code>${e.slug ? ` · <span class="muted">${esc(e.slug)}</span>` : ''}</td>
                          <td><span class="pill ${e.state === 'live' ? 'pill-ok' : 'pill-off'}">${esc(e.state)}</span></td>
                          <td>${e.views}</td>
                          <td>${e.responded} / ${e.households}</td>
                          <td>${e.guests}</td>
                          <td>${e.attending}</td>
                          <td>${e.registryItems}</td>
                          <td>${e.gifts}</td>
                          <td>${e.tasksDone} / ${e.tasks}</td>
                          <td>${e.quotes}</td>

              }

        },
      };

      // Payments: Stripe + Mercado Pago plan purchases, refunds, reconciliation (stream E).
      const Payments = {
        title: 'Payments',
        subtitle: 'Plan purchases through Stripe and Mercado Pago, refunds, reconciliation, and the prices on sale.',
        async render(body) {
          const money = (c, cur) => `$${(c / 100).toLocaleString('es-MX')} ${esc(cur || 'MXN')}`;
          const gatewayName = (g) => (g === 'mercadopago' ? 'Mercado Pago' : g === 'stripe' ? 'Stripe' : esc(g || '—'));
          const today = new Date().toISOString().slice(0, 10);
          const monthAgo = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
          body.replaceChildren(
            el(`<div>
              <div id="prices"></div>
              <div id="pays" style="margin-top:26px"></div>
              <section class="panel" id="recon" style="margin-top:26px">
                <h2>Reconcile</h2>
                <p class="sub">Our settled plan purchases against what the gateway reports for a date range. Anything only one side has, or with a different amount, is flagged.</p>
                <form id="recon-form" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
                  <label>From<br /><input type="date" name="from" value="${monthAgo}" required /></label>
                  <label>To<br /><input type="date" name="to" value="${today}" required /></label>
                  <label>Gateway<br /><select name="gateway"><option value="stripe">Stripe</option><option value="mercadopago">Mercado Pago</option></select></label>
                  <button type="submit" class="btn">Run</button>
                </form>
                <div id="recon-out" style="margin-top:16px"></div>
              </section>
            </div>`),
          );
          const pricesEl = body.querySelector('#prices');
          const paysEl = body.querySelector('#pays');
          const reconForm = body.querySelector('#recon-form');
          const reconOut = body.querySelector('#recon-out');

          const refreshPrices = async () => {
            try {
              const { services } = await api('/admin/services');
              pricesEl.replaceChildren(
                el(`<section class="panel"><h2>Prices</h2>
                  <p class="sub">What hosts pay. Plans: tier_premium, tier_signature. Also the custom domain and custom theme.</p>
                  <div class="table-wrap"><table>
                    <thead><tr><th>Key</th><th>Name</th><th>Price</th><th>Active</th><th></th></tr></thead>
                    <tbody>${services
                      .map(
                        (s) => `<tr>
                          <td><code>${esc(s.key)}</code></td>
                          <td>${esc(s.name)}</td>
                          <td>${money(s.priceCentavos, s.currency)}</td>
                          <td><span class="pill ${s.active ? 'pill-ok' : 'pill-off'}">${s.active ? 'Active' : 'Off'}</span></td>
                          <td style="white-space:nowrap">
                            <button class="link" data-price="${esc(s.key)}">Set price</button>
                            &nbsp;<button class="link" data-toggle="${esc(s.key)}" data-active="${s.active}">${s.active ? 'Turn off' : 'Turn on'}</button>
                          </td></tr>`,
                      )
                      .join('')}</tbody></table></div></section>`),
              );
            } catch (failure) {
              pricesEl.replaceChildren(el(migrationNote(failure)));
            }
          };

          const refreshPays = async () => {
            try {
              const { payments, summary, stripe, gateways } = await api('/admin/payments');
              const list = (rows) => (rows.length ? rows.map((r) => money(r.cents, r.currency)).join(' · ') : '—');
              const chargedCell = (p) => {
                if (p.stripeAmountCents === null) return p.status === 'succeeded' ? '<span class="muted">not synced</span>' : '<span class="muted">—</span>';
                const same = p.stripeAmountCents === p.amountCents && (p.stripeCurrency || p.currency) === p.currency;
                const amount = `<span${same ? '' : ' style="color:#b3261e;font-weight:600"'}>${money(p.stripeAmountCents, p.stripeCurrency || p.currency)}</span>`;
                return p.receiptUrl ? `${amount}<br /><a href="${esc(p.receiptUrl)}" target="_blank" rel="noopener">Receipt</a>` : amount;
              };
              const refundable = (p) => p.status === 'succeeded' || p.status === 'partially_refunded';
              const statusPill = (p) => {
                const cls = p.status === 'succeeded' ? 'pill-ok' : p.status === 'refunded' || p.status === 'partially_refunded' ? 'pill' : 'pill-off';
                const extra = p.refundedCents > 0 ? `<br /><span class="muted">refunded ${money(p.refundedCents, p.currency)}</span>` : '';
                return `<span class="pill ${cls}">${esc(p.status)}</span>${extra}`;
              };
              const gatewayLine = (gateways ?? [])
                .map(
                  (g) =>
                    `<span class="pill ${g.configured ? 'pill-ok' : 'pill-off'}">${esc(g.label)}: ${g.configured ? 'configured' : 'not configured'}${g.default ? ' · default' : ''}${g.active ? '' : ' · off'}</span>`,
                )
                .join(' ');
              paysEl.replaceChildren(
                el(`<div>
                  <section class="panel"><h2>Revenue</h2>
                    <p class="sub">${summary.paid} paid of ${summary.started} started. Totals use the amount the gateway charged where it has been recorded.</p>
                    <p class="sub">${gatewayLine || '<span class="muted">Gateway list unavailable</span>'}</p>
                    <div class="table-wrap"><table>
                      <tbody>
                        <tr><th style="width:220px">Paid (recorded)</th><td>${list(summary.totals)}</td></tr>
                        <tr><th>Refunded</th><td>${list(summary.refunded ?? [])}</td></tr>
                        <tr><th>Stripe balance available</th><td>${stripe ? list(stripe.available) : '<span class="muted">Stripe is not configured or unreachable</span>'}</td></tr>
                        <tr><th>Stripe balance pending</th><td>${stripe ? list(stripe.pending) : '<span class="muted">—</span>'}</td></tr>
                        ${stripe ? `<tr><th>Stripe mode</th><td><span class="pill ${stripe.livemode ? 'pill-ok' : 'pill-off'}">${stripe.livemode ? 'Live' : 'Test'}</span></td></tr>` : ''}
                      </tbody></table></div></section>
                  <div style="margin-top:26px">${
                    payments.length
                      ? `<section class="panel"><h2>Plan purchases</h2>
                        <p class="sub">"Amount" is the price we asked for; "Charged" is what the gateway reports for the settled payment. Sync re-reads a purchase from its gateway. Refund asks the gateway to return money (a full refund takes the plan off the event).</p>
                        <div class="table-wrap"><table>
                          <thead><tr><th>When</th><th>Event</th><th>Plan</th><th>Gateway</th><th>Amount</th><th>Charged</th><th>Method</th><th>Status</th><th></th></tr></thead>
                          <tbody>${payments
                            .map(
                              (p) => `<tr>
                                <td class="muted">${esc(new Date(p.createdAt).toLocaleString())}${p.succeededAt ? `<br />paid ${esc(new Date(p.succeededAt).toLocaleString())}` : ''}</td>
                                <td><span class="name">${esc(p.eventName || p.eventId)}</span><br /><code>${esc(p.eventId)}</code></td>
                                <td>${esc(p.product)}</td>
                                <td>${gatewayName(p.gateway)}${p.gatewayPaymentId ? `<br /><code>${esc(p.gatewayPaymentId)}</code>` : p.stripePaymentIntent ? `<br /><code>${esc(p.stripePaymentIntent)}</code>` : ''}</td>
                                <td>${money(p.amountCents, p.currency)}</td>
                                <td>${chargedCell(p)}</td>
                                <td class="muted">${esc(p.method)}</td>
                                <td>${statusPill(p)}</td>
                                <td style="white-space:nowrap">
                                  <button class="link" data-sync="${esc(p.id)}">Sync</button>
                                  ${refundable(p) ? `&nbsp;<button class="link" data-refund="${esc(p.id)}" data-max="${Math.max(0, (p.stripeAmountCents ?? p.amountCents) - (p.refundedCents || 0))}" data-cur="${esc(p.currency)}">Refund</button>` : ''}
                                </td>
                              </tr>`,
                            )
                            .join('')}</tbody></table></div></section>`
                      : `<div class="empty"><h3>No plan purchases yet</h3><p>Purchases appear here once a host upgrades from their dashboard.</p></div>`
                  }</div>
                </div>`),
              );
            } catch (failure) {
              paysEl.replaceChildren(el(migrationNote(failure)));
            }
          };

          paysEl.addEventListener('click', async (e) => {
            const sync = e.target.closest('button[data-sync]');
            const refund = e.target.closest('button[data-refund]');
            if (!sync && !refund) return;
            const btn = sync || refund;
            try {
              if (sync) {
                btn.disabled = true;
                const r = await api(`/admin/payments/${btn.dataset.sync}/sync`, { method: 'POST' });
                toast(r.applied ? `Synced from the gateway: ${r.status}` : 'The gateway has no record to apply for this purchase');
              } else {
                const max = Number(btn.dataset.max);
                const amount = prompt(`Amount to refund in ${btn.dataset.cur} (blank = full ${(max / 100).toLocaleString('es-MX')}):`);
                if (amount === null) return;
                const reason = prompt('Reason for the refund (kept with the payment):');
                if (reason === null) return;
                if (!reason.trim()) return toast('A reason is required', true);
                const pesos = String(amount).replace(/[$,\s]/g, '');
                const bodyJson = { reason: reason.trim() };
                if (pesos) {
                  const n = Number(pesos);
                  if (!Number.isFinite(n) || n <= 0) return toast('Enter an amount in pesos, or leave blank for a full refund', true);
                  bodyJson.amountCentavos = Math.round(n * 100);
                }
                if (!confirm(`Refund ${pesos ? `$${pesos}` : 'the full amount'} on this purchase? This cannot be undone.`)) return;
                btn.disabled = true;
                const r = await api(`/admin/payments/${btn.dataset.refund}/refund`, { method: 'POST', body: JSON.stringify(bodyJson) });
                toast(`Refunded ${(r.amountCentavos / 100).toLocaleString('es-MX')} (${r.status}) · ref ${r.reference}`);
              }
              await refreshPays();
            } catch (failure) {
              toast(failure.message, true);
              btn.disabled = false;
            }
          });

          pricesEl.addEventListener('click', async (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            try {
              if (btn.dataset.price) {
                const value = prompt(`New price for ${btn.dataset.price}, in MXN (e.g. 2499):`);
                if (value === null) return;
                const pesos = Number(String(value).replace(/[$,\s]/g, ''));
                if (!Number.isFinite(pesos) || pesos < 0) return toast('Enter a number', true);
                await api(`/admin/services/${btn.dataset.price}`, { method: 'PATCH', body: JSON.stringify({ priceCentavos: Math.round(pesos * 100) }) });
                toast('Price saved');
              } else if (btn.dataset.toggle) {
                await api(`/admin/services/${btn.dataset.toggle}`, { method: 'PATCH', body: JSON.stringify({ active: btn.dataset.active !== 'true' }) });
                toast('Saved');
              }
              await refreshPrices();
            } catch (failure) {
              toast(failure.message, true);
            }
          });

          reconForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const f = new FormData(reconForm);
            const q = new URLSearchParams({ from: f.get('from'), to: f.get('to'), gateway: f.get('gateway') });
            reconOut.replaceChildren(el(`<p class="muted">Reading ${gatewayName(f.get('gateway'))}…</p>`));
            try {
              const r = await api(`/admin/payments/reconcile?${q}`);
              const row = (label, items, render) =>
                `<tr><th style="width:220px;vertical-align:top">${label}</th><td>${items.length ? `<ul style="margin:0;padding-left:18px">${items.map(render).join('')}</ul>` : '<span class="muted">none</span>'}</td></tr>`;
              const attemptLine = (a) => `<li><code>${esc(a.id)}</code> · ${esc(a.product)} · ${money(a.amountCents, a.currency)} · ${esc(a.succeededAt || a.createdAt)}</li>`;
              reconOut.replaceChildren(
                el(`<div>
                  <p class="sub"><span class="pill ${r.ok ? 'pill-ok' : 'pill-off'}">${r.ok ? 'In balance' : 'Differences found'}</span>
                    &nbsp;${r.from} → ${r.to} · ours: ${r.totals.oursCount} settled, ${money(r.totals.oursCents, 'MXN')} · ${gatewayName(r.gateway)}: ${r.totals.gatewayCount} settled, ${money(r.totals.gatewayCents, 'MXN')}</p>
                  <div class="table-wrap"><table><tbody>
                    ${row(`Matched (${r.matched.length})`, r.matched, (m) => `<li><code>${esc(m.attempt.id)}</code> ↔ <code>${esc(m.gateway.reference)}</code> · ${money(m.gateway.amountCents, m.gateway.currency)}</li>`)}
                    ${row(`Amount mismatch (${r.mismatched.length})`, r.mismatched, (m) => `<li style="color:#b3261e"><code>${esc(m.attempt.id)}</code> ↔ <code>${esc(m.gateway.reference)}</code> · ${esc(m.problem)}</li>`)}
                    ${row(`In our DB, not at the gateway (${r.missingInGateway.length})`, r.missingInGateway, attemptLine)}
                    ${row(`At the gateway, not in our DB (${r.missingInDb.length})`, r.missingInDb, (g) => `<li><code>${esc(g.reference)}</code> · attempt <code>${esc(g.attemptId)}</code> · ${money(g.amountCents, g.currency)} · ${esc(g.createdAt)}</li>`)}
                  </tbody></table></div>
                </div>`),
              );
            } catch (failure) {
              reconOut.replaceChildren(el(migrationNote(failure)));
            }
          });

          await Promise.all([refreshPrices(), refreshPays()]);
        },
      };

      const Concierge = {
        title: 'Concierge',
        subtitle: 'Print orders, travel help and custom domains that hosts asked Lazo for. Work them here.',
        async render(body) {
          const money = (c) => (c == null ? '—' : `$${(c / 100).toLocaleString('es-MX')} MXN`);
          const STATUSES = ['requested', 'in_progress', 'quoted', 'done', 'cancelled'];
          const refresh = async () => {
            try {
              const { requests } = await api('/admin/concierge');
              body.replaceChildren(
                el(
                  requests.length
                    ? `<section class="panel"><h2>Requests</h2>
                      <p class="sub">${requests.filter((r) => r.status === 'requested').length} new.</p>
                      <div class="table-wrap"><table>
                        <thead><tr><th>When</th><th>Event</th><th>Request</th><th>Details</th><th>Quote</th><th>Status</th><th></th></tr></thead>
                        <tbody>${requests
                          .map(
                            (r) => `<tr>
                              <td class="muted">${esc(new Date(r.createdAt).toLocaleDateString())}</td>
                              <td><span class="name">${esc(r.event.name)}</span><br /><code>${esc(r.eventId)}</code> · <span class="muted">${esc(r.event.tier || 'free')}</span></td>
                              <td><strong>${esc(r.kind)}</strong><br />${esc(r.product)}${r.quantity ? ` × ${r.quantity}` : ''}</td>
                              <td class="muted" style="max-width:320px;white-space:pre-wrap">${esc(r.details)}${r.address ? `\n\n${esc(r.address)}` : ''}${r.adminNote ? `\n\nNote: ${esc(r.adminNote)}` : ''}</td>
                              <td>${money(r.quoteCents)}</td>
                              <td><select data-status="${esc(r.id)}">${STATUSES.map((s) => `<option value="${s}" ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
                              <td style="white-space:nowrap">
                                <button class="link" data-note="${esc(r.id)}">Note</button>
                                &nbsp;<button class="link" data-quote="${esc(r.id)}">Quote</button>
                              </td></tr>`,
                          )
                          .join('')}</tbody></table></div></section>`
                    : `<div class="empty"><h3>No concierge requests yet</h3><p>Signature hosts can ask for print runs and travel help; Premium hosts can request a custom domain.</p></div>`,
                ),
              );
            } catch (failure) {
              body.replaceChildren(el(migrationNote(failure)));
            }
          };

          body.addEventListener('change', async (e) => {
            const sel = e.target.closest('select[data-status]');
            if (!sel) return;
            try {
              await api(`/admin/concierge/${sel.dataset.status}`, { method: 'PATCH', body: JSON.stringify({ status: sel.value }) });
              toast('Status saved');
              await refresh();
            } catch (failure) {
              toast(failure.message, true);
            }
          });
          body.addEventListener('click', async (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            try {
              if (btn.dataset.note) {
                const adminNote = prompt('Note for the host:');
                if (adminNote === null) return;
                await api(`/admin/concierge/${btn.dataset.note}`, { method: 'PATCH', body: JSON.stringify({ adminNote }) });
              } else if (btn.dataset.quote) {
                const v = prompt('Quote in MXN (blank to clear):');
                if (v === null) return;
                const pesos = v.trim() === '' ? null : Number(v.replace(/[$,\s]/g, ''));
                if (pesos !== null && !Number.isFinite(pesos)) return toast('Enter a number', true);
                await api(`/admin/concierge/${btn.dataset.quote}`, { method: 'PATCH', body: JSON.stringify({ quoteCents: pesos === null ? null : Math.round(pesos * 100), status: 'quoted' }) });
              } else return;
              toast('Saved');
              await refresh();
            } catch (failure) {
              toast(failure.message, true);
            }
          });

          await refresh();
        },
      };

      const Chats = {
        title: 'Chats',
        subtitle: 'Every conversation: hosts with vendors, and support. Reply as Lazo, or export everything as JSONL for training.',
        async render(body) {
          body.replaceChildren(
            el(`<div>
              <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
                <select id="ch-kind"><option value="">All kinds</option><option value="vendor">Host ↔ vendor</option><option value="support">Support</option></select>
                <a class="btn btn-ghost" href="/api/admin/chats/export" id="ch-export">Export JSONL</a>
                <a class="btn btn-ghost" href="/api/admin/chats/export?anonymize=1" id="ch-export-anon">Export anonymized</a>
                <span class="muted">Files are also appended on the server as they arrive (CHAT_LOG_DIR).</span>
                <span class="pill pill-ok" style="margin-left:auto">You are online while this page is open</span>
              </div>
              <details class="panel" style="margin-bottom:16px"><summary>Canned replies (type /name in a reply)</summary>
                <form id="ch-sc-form" style="display:grid;grid-template-columns:160px 1fr auto;gap:8px;margin:12px 0">
                  <input id="ch-sc-key" placeholder="shortcut" pattern="[a-z0-9_-]+" required />
                  <input id="ch-sc-body" placeholder="Reply text" required />
                  <button class="btn btn-primary">Save</button>
                </form>
                <div id="ch-sc-list" class="muted"></div>
              </details>
              <div style="display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start">
                <section class="panel" id="ch-list"></section>
                <section class="panel" id="ch-thread"><p class="sub">Pick a conversation.</p></section>
              </div>
            </div>`),
          );
          const listEl = body.querySelector('#ch-list');
          const threadEl = body.querySelector('#ch-thread');
          const kindEl = body.querySelector('#ch-kind');
          let active = null;
          let timer = null;
          let shortcuts = [];
          const typingTimers = new Map();
          const scList = body.querySelector('#ch-sc-list');
          const refreshShortcuts = async () => {
            try {
              ({ shortcuts } = await api('/chats/shortcuts'));
              scList.innerHTML = shortcuts.length
                ? shortcuts.map((s) => `<div style="display:flex;gap:10px;align-items:center;padding:4px 0"><code>/${esc(s.shortcut)}</code><span style="flex:1">${esc(s.body)}</span><button class="link danger" data-sc-del="${esc(s.id)}">Delete</button></div>`).join('')
                : 'None yet.';
            } catch {}
          };
          body.querySelector('#ch-sc-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
              await api('/chats/shortcuts', { method: 'POST', body: JSON.stringify({ shortcut: body.querySelector('#ch-sc-key').value, body: body.querySelector('#ch-sc-body').value }) });
              body.querySelector('#ch-sc-key').value = '';
              body.querySelector('#ch-sc-body').value = '';
              await refreshShortcuts();
            } catch (failure) {
              toast(failure.message, true);
            }
          });
          scList.addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-sc-del]');
            if (!btn) return;
            await api(`/chats/shortcuts/${btn.dataset.scDel}/delete`, { method: 'POST' });
            await refreshShortcuts();
          });
          refreshShortcuts();

          // Downloads need the session token, which a plain link cannot send.
          for (const id of ['ch-export', 'ch-export-anon']) {
            body.querySelector(`#${id}`).addEventListener('click', async (e) => {
              e.preventDefault();
              try {
                const token = await clerk.session.getToken();
                const res = await fetch(e.currentTarget.getAttribute('href'), { headers: { Authorization: `Bearer ${token}` } });
                if (!res.ok) throw new Error(`Export failed (${res.status})`);
                const url = URL.createObjectURL(await res.blob());
                Object.assign(document.createElement('a'), { href: url, download: `lazo-chats${id.endsWith('anon') ? '-anonymized' : ''}.jsonl` }).click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
              } catch (failure) {
                toast(failure.message, true);
              }
            });
          }

          const refreshList = async () => {
            try {
              const { conversations } = await api(`/admin/chats${kindEl.value ? `?kind=${kindEl.value}` : ''}`);
              listEl.replaceChildren(
                el(
                  conversations.length
                    ? `<h2>Conversations</h2><div style="display:grid;gap:6px">${conversations
                        .map(
                          (c) => `<button class="link chat-item" data-open="${esc(c.id)}" aria-current="${c.id === active}">
                            <strong>${esc(c.kind === 'support' ? `${c.customerName} · support` : c.kind === 'guest' ? `${c.customerName} · guest of ${c.eventName ?? ''}` : `${c.customerName} ↔ ${c.vendorName ?? 'vendor'}`)}</strong>
                            ${c.unread ? `<span class="pill pill-ok">${c.unread} new</span>` : ''}${c.rating ? ` <span class="muted">${'★'.repeat(c.rating)}</span>` : ''}${c.assignedTo ? ' <span class="pill pill-muted">assigned</span>' : ''}<br />
                            <span class="muted">${esc(c.eventName ?? '')}${c.eventName ? ' · ' : ''}${esc(c.lastPreview || '—')}</span>
                          </button>`,
                        )
                        .join('')}</div>`
                    : `<div class="empty"><h3>No conversations yet</h3></div>`,
                ),
              );
            } catch (failure) {
              listEl.replaceChildren(el(migrationNote(failure)));
            }
          };

          const openThread = async (id) => {
            active = id;
            try {
              const d = await api(`/chats/${id}`);
              const c = d.conversation;
              const meta = c.visitorMeta ?? {};
              threadEl.replaceChildren(
                el(`<div>
                  <h2>${esc(c.kind === 'support' ? `${c.customerName} · support` : c.kind === 'guest' ? `${c.customerName} · guest` : `${c.customerName} ↔ ${c.vendorName ?? 'vendor'}`)}</h2>
                  <p class="sub"><span class="pill ${c.peerOnline ? 'pill-ok' : 'pill-off'}">${c.peerOnline ? 'online' : 'offline'}</span> ${esc(c.eventName ?? '')} · ${esc(c.status)}${c.visitorEmail ? ` · ${esc(c.visitorEmail)}` : ''}${c.rating ? ` · ${'★'.repeat(c.rating)}${c.ratingNote ? ` “${esc(c.ratingNote)}”` : ''}` : ''}
                    ${c.kind === 'support' ? `<button class="link" id="ch-assign">${c.assignedTo ? 'Release' : 'Take this chat'}</button>` : ''}</p>
                  ${c.visitorPage || meta.userAgent ? `<p class="muted" style="font-size:12px">${c.visitorPage ? `On <a href="${esc(c.visitorPage)}" target="_blank" rel="noopener">${esc(c.visitorPage)}</a>` : ''}${meta.language ? ` · ${esc(meta.language)}` : ''}${meta.screen ? ` · ${esc(meta.screen)}` : ''}${meta.referrer ? ` · from ${esc(meta.referrer)}` : ''}</p>` : ''}
                  <p class="muted" id="ch-typing" style="font-size:12px;min-height:16px"></p>
                  <div id="ch-msgs" style="display:grid;gap:8px;max-height:50vh;overflow:auto;padding:8px 0">${d.messages
                    .map(
                      (m) =>
                        m.kind === 'system'
                          ? `<div class="muted" style="text-align:center;font-size:12px;padding:4px 0">${esc(m.body)} · ${esc(new Date(m.createdAt).toLocaleString())}</div>`
                          : `<div class="bubble${m.kind === 'offer' ? ' offer' : m.senderRole === 'admin' ? ' admin' : ''}${m.flagged ? ' flagged' : ''}">
                        <span class="muted" style="font-size:11px">${esc(m.senderRole)} · ${esc(new Date(m.createdAt).toLocaleString())}${m.flagged ? ' · <b>flagged: contact details before a paid order</b>' : ''}${m.offer ? ` · offer ${esc(m.offer.status)}${m.offer.order ? ` · order ${esc(m.offer.order.status)}` : ''}` : ''}</span>
                        <div style="white-space:pre-wrap">${esc(m.body)}</div>
                        ${(m.attachments ?? []).map((a) => `<div><a href="${esc(a.url ?? '#')}" target="_blank" rel="noopener">📎 ${esc(a.name)}</a></div>`).join('')}</div>`,
                    )
                    .join('')}</div>
                  <form id="ch-form" style="display:flex;gap:8px;margin-top:10px">
                    <input id="ch-text" placeholder="Reply as Lazo" style="flex:1" ${c.status === 'closed' ? 'disabled' : ''} />
                    <button class="btn btn-primary" ${c.status === 'closed' ? 'disabled' : ''}>Send</button>
                  </form>
                </div>`),
              );
              const msgs = threadEl.querySelector('#ch-msgs');
              msgs.scrollTop = msgs.scrollHeight;
              threadEl.querySelector('#ch-assign')?.addEventListener('click', async () => {
                await api(`/chats/${id}/assign`, { method: 'POST', body: JSON.stringify({ release: Boolean(c.assignedTo) }) });
                await openThread(id);
              });
              const input = threadEl.querySelector('#ch-text');
              let lastTyping = 0;
              input.addEventListener('input', () => {
                const m = input.value.match(/(?:^|\s)\/([a-z0-9_-]+)$/i);
                const hit = m && shortcuts.find((s) => s.shortcut === m[1].toLowerCase());
                if (hit) input.value = input.value.replace(/(^|\s)\/[a-z0-9_-]+$/i, `$1${hit.body}`);
                if (Date.now() - lastTyping > 2500) {
                  lastTyping = Date.now();
                  api(`/chats/${id}/typing`, { method: 'POST', body: JSON.stringify({ typing: true }) }).catch(() => {});
                }
              });
              threadEl.querySelector('#ch-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const input = threadEl.querySelector('#ch-text');
                if (!input.value.trim()) return;
                try {
                  await api(`/chats/${id}/messages`, { method: 'POST', body: JSON.stringify({ body: input.value }) });
                  input.value = '';
                  await openThread(id);
                  await refreshList();
                } catch (failure) {
                  toast(failure.message, true);
                }
              });
              await refreshList();
            } catch (failure) {
              threadEl.replaceChildren(el(`<div class="callout">${esc(failure.message)}</div>`));
            }
          };

          listEl.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-open]');
            if (btn) openThread(btn.dataset.open);
          });
          kindEl.addEventListener('change', refreshList);
          await refreshList();
          let refreshTimer = null;
          const onEvent = (ev) => {
            if (!document.body.contains(listEl)) return chatListeners.delete(onEvent);
            if (ev.type === 'message' || ev.type === 'conversation') {
              if (refreshTimer) return;
              refreshTimer = setTimeout(() => {
                refreshTimer = null;
                refreshList();
                if (active) openThread(active);
              }, 800);
              return;
            }
            if (ev.type === 'typing') {
              const el2 = threadEl.querySelector('#ch-typing');
              if (el2 && ev.conversationId === active) {
                el2.textContent = `${ev.payload.role} is typing…`;
                clearTimeout(typingTimers.get(active));
                typingTimers.set(active, setTimeout(() => (el2.textContent = ''), 4000));
              }
              return;
            }
          };
          chatListeners.add(onEvent);
          void timer;
        },
      };

      const Media = {
        title: 'Images',
        subtitle: 'Every image in Storage, across all buckets, with its size. Nothing is edited here; use the section that owns the image.',
        async render(body) {
          const fmtBytes = (n) => {
            if (!n) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            const i = Math.min(units.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
            return `${(n / 1024 ** i).toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
          };
          const inv = await api('/admin/media');

          body.replaceChildren(
            el(`<div>
              <section class="panel"><h2>Buckets</h2>
                <p class="sub">${inv.totalCount} image${inv.totalCount === 1 ? '' : 's'}, ${fmtBytes(inv.totalBytes)} in total.</p>
                <div class="table-wrap"><table>
                  <thead><tr><th>Bucket</th><th>Holds</th><th>Files</th><th>Size</th></tr></thead>
                  <tbody>${inv.buckets
                    .map(
                      (b) => `<tr><td><code>${esc(b.bucket)}</code>${b.exists ? '' : ' <span class="pill pill-off">not created yet</span>'}</td>
                        <td class="muted">${esc(b.purpose)}</td><td class="muted">${b.count}</td><td class="muted">${fmtBytes(b.bytes)}</td></tr>`,
                    )
                    .join('')}</tbody></table></div></section>
              <section class="panel" style="margin-top:26px"><h2>Files</h2>
                <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px">
                  <select id="md-bucket"><option value="">All buckets</option>${inv.buckets
                    .map((b) => `<option value="${esc(b.bucket)}">${esc(b.bucket)} (${b.count})</option>`)
                    .join('')}</select>
                  <input id="md-q" type="search" placeholder="Filter by path" style="flex:1;min-width:200px" />
                  <select id="md-sort"><option value="newest">Newest first</option><option value="largest">Largest first</option><option value="path">By path</option></select>
                </div>
                <div id="md-list"></div>
              </section>
            </div>`),
          );

          const bucketEl = body.querySelector('#md-bucket');
          const qEl = body.querySelector('#md-q');
          const sortEl = body.querySelector('#md-sort');
          const listEl = body.querySelector('#md-list');

          const draw = () => {
            const q = qEl.value.trim().toLowerCase();
            let rows = inv.images.filter((f) => (!bucketEl.value || f.bucket === bucketEl.value) && (!q || f.path.toLowerCase().includes(q)));
            if (sortEl.value === 'largest') rows = rows.sort((a, b) => b.size - a.size);
            else if (sortEl.value === 'path') rows = rows.sort((a, b) => `${a.bucket}/${a.path}`.localeCompare(`${b.bucket}/${b.path}`));
            else rows = rows.sort((a, b) => (b.createdAt ?? '').localeCompare(a.createdAt ?? ''));

            listEl.replaceChildren(
              el(
                rows.length
                  ? `<p class="sub">${rows.length} file${rows.length === 1 ? '' : 's'}, ${fmtBytes(rows.reduce((s, f) => s + f.size, 0))}.</p>
                    <div class="table-wrap"><table>
                      <thead><tr><th></th><th>Path</th><th>Bucket</th><th>Type</th><th>Size</th><th>Uploaded</th></tr></thead>
                      <tbody>${rows
                        .map(
                          (f) => `<tr>
                            <td><a href="${esc(f.url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(f.url)}" alt="" loading="lazy" /></a></td>
                            <td><a href="${esc(f.url)}" target="_blank" rel="noopener"><code>${esc(f.path)}</code></a></td>
                            <td class="muted">${esc(f.bucket)}</td>
                            <td class="muted">${esc(f.mimetype ?? '—')}</td>
                            <td class="muted" style="white-space:nowrap">${fmtBytes(f.size)}</td>
                            <td class="muted" style="white-space:nowrap">${f.createdAt ? esc(new Date(f.createdAt).toLocaleString()) : '—'}</td>
                          </tr>`,
                        )
                        .join('')}</tbody></table></div>`
                  : inv.totalCount
                    ? `<div class="empty"><h3>Nothing matches</h3><p>Try another bucket or a shorter filter.</p></div>`
                    : `<div class="empty"><h3>No images in Storage yet</h3><p>They appear here once a theme, occasion card, vendor or event site uploads one.</p></div>`,
              ),
            );
          };

          for (const elx of [bucketEl, sortEl]) elx.addEventListener('change', draw);
          qEl.addEventListener('input', draw);
          draw();
        },
      };

      const Invoices = {
        title: 'Invoices',
        subtitle: 'Receipts Lazo issued for paid plans (one per succeeded payment). IVA 16 % is shown as included. No CFDI is stamped: a PAC is not integrated.',
        async render(body) {
          const money = (c, cur) => (c == null ? '—' : `${(c / 100).toLocaleString('es-MX', { minimumFractionDigits: 2 })} ${cur || 'MXN'}`);
          const when = (iso) => (iso ? new Date(iso).toLocaleDateString() : '—');
          try {
            const { invoices, totals } = await api('/admin/invoices');
            const summary = totals.length
              ? `<section class="panel"><h2>Issued</h2><p class="sub">${totals
                  .map((t) => `${esc(t.currency)}: ${money(t.cents, t.currency)} total · ${money(t.tax, t.currency)} IVA included`)
                  .join(' · ')}</p></section>`
              : '';
            body.replaceChildren(
              el(
                invoices.length
                  ? `${summary}<section class="panel"><h2>Invoices</h2>
                    <p class="sub">${invoices.length} issued.</p>
                    <div class="table-wrap"><table>
                      <thead><tr><th>Number</th><th>Issued</th><th>Event</th><th>Owner</th><th>Concept</th><th>Subtotal</th><th>IVA</th><th>Total</th><th>Fiscal</th><th>Gateway</th></tr></thead>
                      <tbody>${invoices
                        .map(
                          (i) => `<tr>
                            <td><code>${esc(i.number || '—')}</code><br /><span class="muted">${esc(i.status)}</span></td>
                            <td class="muted">${esc(when(i.issuedAt))}</td>
                            <td>${i.eventName ? `<span class="name">${esc(i.eventName)}</span><br />` : ''}<code>${esc(i.eventId || '—')}</code></td>
                            <td><code>${esc(i.ownerId || '—')}</code></td>
                            <td class="muted">${esc(i.lineItems.map((l) => l.description).join(', '))}</td>
                            <td>${money(i.subtotalCentavos, i.currency)}</td>
                            <td>${money(i.taxCentavos, i.currency)}</td>
                            <td><strong>${money(i.totalCentavos, i.currency)}</strong></td>
                            <td class="muted">${i.rfc ? `${esc(i.rfc)}<br />${esc(i.razonSocial)}${i.cfdiUso ? ` · ${esc(i.cfdiUso)}` : ''}` : '—'}${i.uuidFiscal ? `<br />UUID ${esc(i.uuidFiscal)}` : ''}</td>
                            <td class="muted">${esc(i.gateway || '—')}<br /><code>${esc(i.gatewayReference || '')}</code></td>
                          </tr>`,
                        )
                        .join('')}</tbody></table></div></section>`
                  : `<div class="empty"><h3>No invoices yet</h3><p>An invoice is created the moment a plan payment succeeds (checkout confirm or Stripe webhook).</p></div>`,
              ),
            );
          } catch (failure) {
            body.replaceChildren(el(migrationNote(failure)));

      // Vendor orders: every quote a host paid through Stripe Connect, Lazo's
      // commission, each vendor's settlement state, and a Stripe-vs-DB check.
      // Nav key: vendorOrders. Routes: /api/admin/vendor-orders[...].
      const VendorOrders = {
        title: 'Vendor orders',
        subtitle: 'Quotes hosts paid through Stripe Connect: totals, refunds, disputes, each vendor’s payout state, and reconciliation against Stripe.',
        async render(body) {
          const money = (c, cur) => (c == null ? '—' : `${(c / 100).toLocaleString('es-MX', { minimumFractionDigits: 2 })} ${esc(cur || 'MXN')}`);
          const STATUSES = ['pending_payment', 'paid', 'in_progress', 'fulfilled', 'cancelled', 'refunded', 'disputed'];
          const pill = (status) => {
            const tone = ['paid', 'in_progress', 'fulfilled'].includes(status) ? 'pill-ok' : ['refunded', 'disputed'].includes(status) ? 'pill-bad' : 'pill-off';
            return `<span class="pill ${tone}">${esc(status.replace(/_/g, ' '))}</span>`;
          };
          const day = (d) => new Date(d).toISOString().slice(0, 10);
          const since = new Date(Date.now() - 30 * 86400000);

          body.replaceChildren(
            el(`<div>
              <section class="panel" style="margin-bottom:16px">
                <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
                  <label>From<br /><input type="date" id="vo-from" value="${day(since)}" /></label>
                  <label>To<br /><input type="date" id="vo-to" value="${day(new Date())}" /></label>
                  <label>Status<br /><select id="vo-status"><option value="">All</option>${STATUSES.map((s) => `<option value="${s}">${s.replace(/_/g, ' ')}</option>`).join('')}</select></label>
                  <button class="btn btn-primary" id="vo-load">Load</button>
                  <button class="btn btn-ghost" id="vo-reconcile">Reconcile with Stripe</button>
                  <span id="vo-commission" class="muted" style="margin-left:auto"></span>
                </div>
              </section>
              <div id="vo-totals"></div>
              <div id="vo-recon"></div>
              <div id="vo-orders" style="margin-top:16px"></div>
              <div id="vo-vendors" style="margin-top:16px"></div>
            </div>`),
          );
          const $ = (id) => body.querySelector(id);
          const query = () => {
            const p = new URLSearchParams();
            if ($('#vo-from').value) p.set('from', $('#vo-from').value);
            if ($('#vo-to').value) p.set('to', $('#vo-to').value);
            if ($('#vo-status').value) p.set('status', $('#vo-status').value);
            return p.toString();
          };

          const refresh = async () => {
            try {
              const { orders, totals, vendors, commission } = await api(`/admin/vendor-orders?${query()}`);
              $('#vo-commission').innerHTML = commission.present
                ? `Lazo commission: <strong>${commission.pct}%</strong>${commission.active ? '' : ' (off)'} <button class="link" data-commission="1">Change</button>`
                : 'Commission row missing: apply supabase/migrations/20261009000000_vendor_orders.sql';
              $('#vo-totals').replaceChildren(
                el(`<section class="panel"><h2>Totals</h2>
                  <p class="sub">${orders.length} orders in this range. Money that moved: paid orders minus what came back.</p>
                  <div class="table-wrap"><table><tbody>
                    <tr><th style="width:220px">Gross paid</th><td>${money(totals.gross)}</td></tr>
                    <tr><th>Lazo fees (net of refunds)</th><td>${money(totals.platformFees)}</td></tr>
                    <tr><th>Refunds</th><td>${money(totals.refunds)}</td></tr>
                    <tr><th>Disputed (open or lost)</th><td>${money(totals.disputed)}</td></tr>
                    <tr><th>Net to vendors</th><td><strong>${money(totals.netToVendors)}</strong></td></tr>
                  </tbody></table></div></section>`),
              );
              $('#vo-orders').replaceChildren(
                el(
                  orders.length
                    ? `<section class="panel"><h2>Orders</h2>
                      <div class="table-wrap"><table>
                        <thead><tr><th>When</th><th>Event</th><th>Vendor</th><th>Order</th><th>Paid</th><th>Fee</th><th>Refunded</th><th>Status</th><th></th></tr></thead>
                        <tbody>${orders
                          .map(
                            (o) => `<tr>
                              <td class="muted">${esc(new Date(o.paidAt || o.createdAt).toLocaleDateString())}</td>
                              <td><span class="name">${esc(o.eventName)}</span><br /><code>${esc(o.eventId)}</code></td>
                              <td>${esc(o.vendor.name)}</td>
                              <td>${esc(o.title)}${o.amountCentavos < o.quoteAmountCentavos ? `<br /><span class="muted">deposit of ${money(o.quoteAmountCentavos, o.currency)}</span>` : ''}<br /><code>${esc(o.stripePaymentIntent || '')}</code></td>
                              <td>${money(o.amountCentavos, o.currency)}${o.receiptUrl ? `<br /><a href="${esc(o.receiptUrl)}" target="_blank" rel="noopener">Receipt</a>` : ''}</td>
                              <td>${money(o.platformFeeCentavos, o.currency)}</td>
                              <td>${o.refundedCentavos ? money(o.refundedCentavos, o.currency) : '—'}${o.refunds.map((r) => `<br /><span class="muted">${esc(r.requestedBy)} · ${esc(r.status)}: ${esc(r.reason)}</span>`).join('')}</td>
                              <td>${pill(o.status)}${o.disputes.map((d) => `<br /><span class="muted">dispute ${esc(d.status.replace(/_/g, ' '))}${d.evidenceDueBy ? ` · evidence by ${esc(new Date(d.evidenceDueBy).toLocaleDateString())}` : ''}</span>`).join('')}</td>
                              <td style="white-space:nowrap">${['paid', 'in_progress', 'fulfilled'].includes(o.status) && o.refundedCentavos < o.amountCentavos ? `<button class="link" data-refund="${esc(o.id)}" data-max="${o.amountCentavos - o.refundedCentavos}">Refund</button>` : ''}</td>
                            </tr>`,
                          )
                          .join('')}</tbody></table></div></section>`
                    : `<div class="empty"><h3>No vendor orders in this range</h3><p>Orders appear when a host accepts a vendor’s quote and pays it.</p></div>`,
                ),
              );
              $('#vo-vendors').replaceChildren(
                el(
                  vendors.length
                    ? `<section class="panel"><h2>Vendor settlement</h2>
                      <p class="sub">Vendors with a Stripe Connect account, and their money in this range. Payouts to their bank are Stripe's.</p>
                      <div class="table-wrap"><table>
                        <thead><tr><th>Vendor</th><th>Stripe account</th><th>Onboarding</th><th>Charges</th><th>Payouts</th><th>Orders</th><th>Paid</th><th>Refunded</th><th>Lazo fees</th><th>Checked</th></tr></thead>
                        <tbody>${vendors
                          .map(
                            (v) => `<tr>
                              <td><span class="name">${esc(v.name)}</span><br /><span class="muted">${esc(v.status || '')}</span></td>
                              <td><code>${esc(v.stripeAccountId || '—')}</code></td>
                              <td><span class="pill ${v.onboardingStatus === 'complete' ? 'pill-ok' : v.onboardingStatus === 'restricted' ? 'pill-bad' : 'pill-off'}">${esc(v.onboardingStatus)}</span></td>
                              <td>${v.chargesEnabled ? 'on' : 'off'}</td>
                              <td>${v.payoutsEnabled ? 'on' : 'off'}</td>
                              <td>${v.orders}</td>
                              <td>${money(v.paid)}</td>
                              <td>${v.refunded ? money(v.refunded) : '—'}</td>
                              <td>${money(v.fees)}</td>
                              <td class="muted">${v.syncedAt ? esc(new Date(v.syncedAt).toLocaleString()) : '—'}</td>
                            </tr>`,
                          )
                          .join('')}</tbody></table></div></section>`
                    : '',
                ),
              );
            } catch (failure) {
              $('#vo-totals').replaceChildren(el(migrationNote(failure)));
            }
          };

          const reconcile = async () => {
            $('#vo-recon').replaceChildren(el('<section class="panel"><p class="sub">Reading Stripe balance transactions…</p></section>'));
            try {
              const p = new URLSearchParams();
              if ($('#vo-from').value) p.set('from', $('#vo-from').value);
              if ($('#vo-to').value) p.set('to', $('#vo-to').value);
              const r = await api(`/admin/vendor-orders/reconcile?${p}`);
              $('#vo-recon').replaceChildren(
                el(`<section class="panel"><h2>Reconciliation</h2>
                  <p class="sub">${r.stripe.transactions} Stripe transactions vs ${r.db.orders} paid orders, ${esc(r.from.slice(0, 10))} → ${esc(r.to.slice(0, 10))}. Plan purchases on the same Stripe account are not vendor orders and are ignored.</p>
                  <div class="table-wrap"><table>
                    <thead><tr><th></th><th>Stripe</th><th>Database</th></tr></thead>
                    <tbody>
                      <tr><th>Gross charges</th><td>${money(r.stripe.gross)}</td><td>${money(r.db.gross)}</td></tr>
                      <tr><th>Refunds</th><td>${money(r.stripe.refunds)}</td><td>${money(r.db.refunds)}</td></tr>
                      <tr><th>Application fees</th><td>${money(r.stripe.applicationFees)}</td><td>${money(r.db.platformFees)}</td></tr>
                    </tbody></table></div>
                  ${
                    r.mismatches.length
                      ? `<h3 style="margin-top:16px">${r.mismatches.length} mismatch${r.mismatches.length === 1 ? '' : 'es'}</h3>
                        <div class="table-wrap"><table>
                          <thead><tr><th>Kind</th><th>Stripe id</th><th>Order</th><th>Stripe</th><th>Database</th><th>Detail</th></tr></thead>
                          <tbody>${r.mismatches
                            .map(

      // ---- Fulfilment: partners (print / flowers / travel), their orders, and retailer API status.

      // Nav key: 'fulfilment'; icon d (24x24 single path): "M3 7l9-4 9 4v10l-9 4-9-4V7zm9 4l9-4M12 11v10M12 11L3 7"; tint: #0e7c86

      // ---- Analytics warehouse (PRD §2.1 / §8): operating metrics from the

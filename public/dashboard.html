      // Nav key: analytics. Register as `analytics: Analytics` in `sections`.
      const Analytics = {
        title: 'Analytics',
        subtitle: 'Operating metrics from the analytics warehouse: funnel, revenue by gateway, RSVPs, gifts, vendor leads, messaging and chat. Numbers are as of the last ingest, never live.',
        async render(body) {
          const money = (c) => (c == null ? '—' : `${(c / 100).toLocaleString('es-MX', { maximumFractionDigits: 0 })} MXN`);
          const int = (v) => (v == null ? '—' : Number(v).toLocaleString('es-MX'));
          const pct = (v) => (v == null ? '—' : `${(v * 100).toFixed(1)}%`);
          const secs = (v) => (v == null ? '—' : v < 3600 ? `${Math.round(v / 60)} min` : `${(v / 3600).toFixed(1)} h`);
          const ago = (iso) => {
            if (!iso) return '—';
            const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
            return m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
          };
          const inWhen = (iso) => {
            if (!iso) return '';
            const m = Math.round((new Date(iso).getTime() - Date.now()) / 60000);
            return m <= 0 ? 'now' : m < 60 ? `in ${m} min` : `in ${(m / 60).toFixed(1)} h`;
          };
          const isoDay = (d) => d.toISOString().slice(0, 10);
          const state = { to: isoDay(new Date()), from: isoDay(new Date(Date.now() - 29 * 86400000)), metric: 'site_views' };

          // Accessible inline SVG chart: a <table> of the same numbers is the
          // fallback for screen readers (visually hidden), the SVG is aria-hidden.
          const chart = (series) => {
            const pts = series.points || [];
            const W = 720, H = 220, L = 56, R = 12, T = 12, B = 34;
            const fmt = series.unit === 'cents' ? (v) => `${(v / 100).toLocaleString('es-MX', { maximumFractionDigits: 0 })}` : series.unit === 'seconds' ? (v) => `${Math.round(v / 60)}m` : (v) => int(v);
            const max = Math.max(1, ...pts.map((p) => p.value));
            const x = (i) => L + (pts.length > 1 ? (i * (W - L - R)) / (pts.length - 1) : (W - L - R) / 2);
            const y = (v) => T + (H - T - B) * (1 - v / max);
            const bars = pts.length <= 45;
            const bw = bars ? Math.max(2, ((W - L - R) / Math.max(pts.length, 1)) * 0.6) : 0;
            const marks = bars
              ? pts.map((p, i) => `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(p.value).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - y(p.value)).toFixed(1)}" rx="2" fill="var(--tint, #2f7fb5)"><title>${esc(p.day)}: ${esc(fmt(p.value))}</title></rect>`).join('')
              : `<polyline fill="none" stroke="var(--tint, #2f7fb5)" stroke-width="2" points="${pts.map((p, i) => `${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ')}" />`;
            const ticks = [0, 0.5, 1].map((f) => `<g><line x1="${L}" x2="${W - R}" y1="${y(max * f).toFixed(1)}" y2="${y(max * f).toFixed(1)}" stroke="currentColor" stroke-opacity=".12" /><text x="${L - 6}" y="${(y(max * f) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="currentColor" fill-opacity=".7">${esc(fmt(max * f))}</text></g>`).join('');
            const labelEvery = Math.max(1, Math.ceil(pts.length / 8));
            const xl = pts.map((p, i) => (i % labelEvery === 0 || i === pts.length - 1 ? `<text x="${x(i).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity=".7">${esc(p.day.slice(5))}</text>` : '')).join('');
            const total = pts.reduce((a, p) => a + p.value, 0);
            return `<figure style="margin:0">
              <figcaption class="muted" style="margin-bottom:6px">${esc(series.label)} · ${esc(series.from)} → ${esc(series.to)} · total ${esc(series.unit === 'seconds' ? secs(total / Math.max(pts.filter((p) => p.value).length, 1)) : fmt(total))}</figcaption>
              <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(series.label)}, ${pts.length} days" style="display:block;max-height:260px;font-variant-numeric:tabular-nums">${ticks}${marks}${xl}</svg>
              <table style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"><caption>${esc(series.label)}</caption><thead><tr><th>Day</th><th>Value</th></tr></thead><tbody>${pts.map((p) => `<tr><td>${esc(p.day)}</td><td>${esc(fmt(p.value))}</td></tr>`).join('')}</tbody></table>
            </figure>`;
          };

          const tile = (label, value, note) => `<div class="tile"><dt>${esc(label)}</dt><dd style="font-variant-numeric:lining-nums tabular-nums">${value}${note ? `<span class="note">${note}</span>` : ''}</dd></div>`;
          const pill = (s) => `<span class="pill ${s === 'ok' ? 'pill-ok' : s === 'mismatch' || s === 'error' ? 'pill-off' : 'pill-muted'}">${esc(s)}</span>`;

          body.replaceChildren(
            el(`<div>
              <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
                <label>From <input type="date" id="an-from" value="${state.from}" /></label>
                <label>To <input type="date" id="an-to" value="${state.to}" /></label>
                <button class="btn btn-ghost" id="an-apply">Apply</button>
                <span class="muted" id="an-fresh" style="margin-left:auto"></span>
              </div>
              <div id="an-kpis"></div>
              <section class="panel" style="margin-top:16px">
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Chart</h2>
                  <select id="an-metric" aria-label="Metric"></select></div>
                <div id="an-chart" style="margin-top:12px;position:relative"></div>
              </section>
              <section class="panel" style="margin-top:16px" id="an-ingest"></section>
              <section class="panel" style="margin-top:16px" id="an-recon"></section>
            </div>`),
          );
          const $ = (s) => body.querySelector(s);
          const q = () => `from=${state.from}&to=${state.to}`;

          const renderKpis = async () => {
            try {
              const o = await api(`/admin/analytics/overview?${q()}`);
              $('#an-fresh').textContent = o.ingest.hasRun ? `As of ${new Date(o.ingest.lastWindowTo).toLocaleString()} (${ago(o.ingest.lastWindowTo)})` : 'No ingest has run yet';
              if (!o.ingest.hasRun) {
                $('#an-kpis').replaceChildren(el(`<div class="empty"><h3>No data yet</h3><p>The warehouse is empty until the first ingest runs. Use “Run now” below, or wait for the scheduler.</p></div>`));
                return;
              }
              const gw = o.revenue.byGateway;
              $('#an-kpis').replaceChildren(
                el(`<div>
                  <h2>Funnel</h2>
                  <dl class="tiles">
                    ${tile('Events created', int(o.events.created), `${int(o.events.total)} in total`)}
                    ${tile('Claimed', int(o.events.claimed))}
                    ${tile('Paid', int(o.events.paid))}
                    ${tile('Published', int(o.events.published), `${pct(o.events.publishRate)} of created · ${int(o.events.liveTotal)} live now`)}
                    ${tile('Site views', int(o.siteViews.views), `${int(o.siteViews.events)} events`)}
                    ${tile('Photos', int(o.photos.uploaded), `${int(o.photos.approved)} approved`)}
                  </dl>
                  <h2 style="margin-top:20px">Money</h2>
                  <dl class="tiles">
                    ${tile('LAZO revenue', money(o.revenue.lazoRevenueCents), 'event fees + platform fees, net of refunds')}
                    ${tile('GMV', money(o.revenue.gmvCents), 'paid gifts + vendor orders')}
                    ${tile('Refunds', money(o.revenue.refundsCents))}
                    ${tile('Provider costs', money(o.revenue.providerCostCents), 'gateway fees, from reconciliation')}
                    ${tile('Gift reports', int(o.gifts.reports), `${money(o.gifts.paidCents)} paid`)}
                    ${tile('Vendor orders', int(o.orders.created), `${int(o.orders.fulfilled)} fulfilled`)}
                  </dl>
                  ${gw.length ? `<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Gateway</th><th>Flow</th><th>Attempts</th><th>Succeeded</th><th>Failed</th><th>Gross</th><th>Refunded</th><th>Fees</th></tr></thead>
                    <tbody>${gw.map((g) => `<tr><td>${esc(g.gateway)}</td><td>${esc(g.flow)}</td><td>${int(g.attempts)}</td><td>${int(g.succeeded)}</td><td>${int(g.failed)}</td><td>${money(g.grossCents)}</td><td>${money(g.refundedCents)}</td><td>${money(g.feeCents)}</td></tr>`).join('')}</tbody></table></div>` : `<p class="muted">No payment attempts in this range.</p>`}
                  <h2 style="margin-top:20px">Guests, vendors, messaging</h2>
                  <dl class="tiles">
                    ${tile('RSVP rate', pct(o.rsvps.rate), `${int(o.rsvps.answered)} of ${int(o.rsvps.total)} answered · ${int(o.rsvps.attending)} attending`)}
                    ${tile('Vendor leads', int(o.vendors.leads), `${int(o.vendors.selections)} selections · ${int(o.vendors.quotes)} quotes · ${int(o.vendors.conversations)} chats`)}
                    ${tile('Listing views', int(o.vendors.listingViews), `${int(o.vendors.activeVendors)} active vendors`)}
                    ${tile('Message delivery', pct(o.messages.deliveryRate), `${int(o.messages.sent)} sent · ${int(o.messages.failed)} failed`)}
                    ${o.chat.map((c) => tile(`Chat ${c.kind}: first reply`, secs(c.avgFirstResponseSeconds), `${int(c.responded)} of ${int(c.started)} answered · ${int(c.messages)} messages`)).join('') || tile('Chat', '—', 'no conversations in range')}
                    ${tile('Reconciliation', `${int(o.reconciliation.ok)} ok`, `${int(o.reconciliation.mismatch)} mismatch · ${int(o.reconciliation.unchecked)} unchecked`)}
                  </dl>
                </div>`),
              );
            } catch (failure) {
              $('#an-kpis').replaceChildren(el(migrationNote(failure)));
            }
          };

          const renderChart = async () => {
            try {
              const s = await api(`/admin/analytics/series?metric=${encodeURIComponent(state.metric)}&${q()}`);
              $('#an-chart').replaceChildren(el(chart(s)));
            } catch (failure) {
              $('#an-chart').replaceChildren(el(`<p class="muted">${esc(failure.message)}</p>`));
            }
          };

          const renderIngest = async () => {
            try {
              const s = await api('/admin/analytics/ingest');
              $('#an-ingest').replaceChildren(
                el(`<div>
                  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                    <h2 style="margin:0">Ingest</h2>
                    <button class="btn btn-primary" id="an-run" ${s.running ? 'disabled' : ''}>${s.running ? 'Running…' : 'Run now'}</button>
                    <span class="muted">${s.intervalMinutes ? `Every ${s.intervalMinutes} min${s.nextRunAt ? `, next ${inWhen(s.nextRunAt)}` : ''}` : 'Scheduler off (ANALYTICS_INGEST_INTERVAL_MINUTES=0)'}${s.freshnessMinutes != null ? ` · fresh to ${s.freshnessMinutes} min ago` : ''}</span>
                  </div>
                  ${s.recent.length ? `<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Started</th><th>Trigger</th><th>Window</th><th>Rows</th><th>Status</th><th>Error</th></tr></thead>
                    <tbody>${s.recent.map((r) => `<tr><td class="muted">${esc(new Date(r.startedAt).toLocaleString())}</td><td>${esc(r.trigger)}</td><td class="muted">${esc(r.windowFrom.slice(0, 16))} → ${esc(r.windowTo.slice(0, 16))}</td><td>${int(r.rows)}</td><td>${pill(r.status)}</td><td class="muted" style="max-width:320px;white-space:pre-wrap">${esc(r.error)}</td></tr>`).join('')}</tbody></table></div>` : `<p class="muted" style="margin-top:12px">No runs yet.</p>`}
                </div>`),
              );
            } catch (failure) {
              $('#an-ingest').replaceChildren(el(migrationNote(failure)));
            }
          };

          const renderRecon = async () => {
            try {
              const rows = await api(`/admin/analytics/reconciliation?${q()}`);
              const cfg = await api('/admin/analytics/config');
              $('#an-recon').replaceChildren(
                el(`<div>
                  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                    <h2 style="margin:0">Revenue reconciliation</h2>
                    <button class="btn btn-ghost" id="an-reconcile">Reconcile this range</button>
                    <span class="muted">Stripe ${cfg.gateways.stripe ? 'configured' : 'not configured (STRIPE_SECRET_KEY)'} · Mercado Pago ${cfg.gateways.mercadopago ? 'configured' : 'not configured (MERCADOPAGO_ACCESS_TOKEN)'}</span>
                  </div>
                  ${rows.length ? `<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Day</th><th>Gateway</th><th>DB gross</th><th>Gateway gross</th><th>DB #</th><th>Gateway #</th><th>Delta</th><th>Fees</th><th>Status</th><th>Checked</th></tr></thead>
                    <tbody>${rows.map((r) => `<tr><td>${esc(r.day)}</td><td>${esc(r.gateway)}</td><td>${money(r.dbGross)}</td><td>${money(r.gatewayGross)}</td><td>${int(r.dbCount)}</td><td>${int(r.gatewayCount)}</td><td>${r.delta == null ? '—' : money(r.delta)}</td><td>${money(r.gatewayFeeCents)}</td><td>${pill(r.status)}${r.note ? ` <span class="muted" title="${esc(r.note)}">ⓘ</span>` : ''}</td><td class="muted">${r.checkedAt ? esc(new Date(r.checkedAt).toLocaleString()) : '—'}</td></tr>`).join('')}</tbody></table></div>` : `<p class="muted" style="margin-top:12px">No payment days in this range.</p>`}
                </div>`),
              );
            } catch (failure) {
              $('#an-recon').replaceChildren(el(migrationNote(failure)));
            }
          };

          const renderAll = () => Promise.all([renderKpis(), renderChart(), renderIngest(), renderRecon()]);

          try {
            const cfg = await api('/admin/analytics/config');
            $('#an-metric').replaceChildren(...cfg.metrics.map((m) => el(`<option value="${esc(m.key)}" ${m.key === state.metric ? 'selected' : ''}>${esc(m.label)}</option>`)));
          } catch (failure) {
            body.replaceChildren(el(migrationNote(failure)));
            return;
          }

          $('#an-apply').addEventListener('click', () => {
            state.from = $('#an-from').value || state.from;
            state.to = $('#an-to').value || state.to;
            renderAll();
          });
          $('#an-metric').addEventListener('change', (e) => {
            state.metric = e.target.value;
            renderChart();
          });
          body.addEventListener('click', async (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            try {
              if (btn.id === 'an-run') {
                btn.disabled = true;
                btn.textContent = 'Running…';
                const run = await api('/admin/analytics/ingest', { method: 'POST' });
                toast(run.status === 'ok' ? `Ingested ${run.rows} rows` : `Ingest failed: ${run.error}`, run.status !== 'ok');
                await renderAll();
              } else if (btn.id === 'an-reconcile') {
                btn.disabled = true;
                const res = await api('/admin/analytics/reconcile', { method: 'POST', body: JSON.stringify({ from: state.from, to: state.to }) });
                toast(Object.entries(res.gateways).map(([g, s]) => `${g}: ${s}`).join(' · ') || 'Nothing to reconcile');
                await Promise.all([renderRecon(), renderKpis()]);
              }
            } catch (failure) {
              toast(failure.message, true);
              btn.disabled = false;
            }
          });

          await renderAll();
        },
      };

      // ===================== Shell =====================

      const start = async () => {
        const [isAdmin, modes, site] = await Promise.all([
          api('/admin/me')
            .then(() => true)
            .catch(() => false),
          fetch('/api/event-types')
            .then((r) => r.json())
            .catch(() => ({ types: [] })),
          fetch('/api/sites/config')
            .then((r) => r.json())
            .catch(() => SITE),
        ]);
        MODES = Object.fromEntries((modes.types ?? []).map((t) => [t.value, t.label]));
        FIELDS = Object.fromEntries(
          (modes.types ?? []).map((t) => [t.value, Object.fromEntries((t.fields ?? []).map((f) => [f.key, f.label]))]),
        );
        SITE = site;

        const sections = { overview: Overview, events: Events, keys: Keys };
        if (isAdmin) {
          Object.assign(sections, {
            admin: Admin,
            vendors: Vendors,
            sites: Sites,
            users: Users,
            requests: Requests,
            themes: Themes,
            homepage: Homepage,
            activity: Activity,
            payments: Payments,
            concierge: Concierge,
            chats: Chats,
            media: Media,
            // PRD V1 gaps (2026-09-26)
            invoices: Invoices,
            vendorOrders: VendorOrders,
            whatsapp: WhatsApp,
            fulfilment: Fulfilment,
            analytics: Analytics,
          });
        }

        root.replaceChildren(document.querySelector('#tpl-shell').content.cloneNode(true));

        const nav = document.querySelector('#nav');
        const title = document.querySelector('#title');
        const subtitle = document.querySelector('#subtitle');
        const bodyEl = document.querySelector('#body');

        // Sidebar groups. A key that is not registered (planner accounts see only
        // the workspace) is skipped; anything registered but not listed lands in "More".
        const GROUPS = [
          ['Workspace', ['overview', 'events', 'keys']],
          ['Operations', ['admin', 'sites', 'users', 'requests', 'concierge', 'chats', 'whatsapp']],
          ['Marketplace', ['vendors', 'vendorOrders', 'fulfilment', 'payments', 'invoices']],
          ['Content', ['themes', 'homepage', 'media']],
          ['Insights', ['activity', 'analytics']],
        ];
        const placed = new Set(GROUPS.flatMap(([, keys]) => keys));
        const rest = Object.keys(sections).filter((k) => !placed.has(k));
        if (rest.length) GROUPS.push(['More', rest]);
        for (const [label, keys] of GROUPS) {
          const present = keys.filter((k) => sections[k]);
          if (!present.length) continue;
          const group = el(`<div class="nav-group"><span class="nav-label">${esc(label)}</span></div>`);
          for (const key of present) {
            group.appendChild(
              el(`<button type="button" data-section="${key}" style="--tint:${TINTS[key] ?? '#2f7fb5'}">
                <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="${ICONS[key]}" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" />
                </svg></span><span class="nav-text">${esc(sections[key].title)}</span>${
                  key === 'chats' ? '<span class="badge" id="chats-badge" hidden></span>' : ''
                }</button>`),
            );
          }
          nav.appendChild(group);
        }

        const user = clerk.user;
        const displayName = user.firstName ?? user.primaryEmailAddress?.emailAddress ?? 'Signed in';
        document.querySelector('#whoami').innerHTML =
          `<strong title="${esc(user.primaryEmailAddress?.emailAddress ?? '')}">${esc(displayName)}</strong>${esc(isAdmin ? 'Admin' : 'Planner')}`;
        document.querySelector('#avatar').textContent = displayName.trim().charAt(0) || '·';
        document.querySelector('#brand-role').textContent = isAdmin ? 'Admin console' : 'Workspace';
        document
          .querySelector('#sign-out')
          .addEventListener('click', () => clerk.signOut({ redirectUrl: '/login' }));

        // Theme: system by default; the button cycles light → dark → back to system.
        document.querySelector('#theme-toggle').addEventListener('click', () => {
          const html = document.documentElement;
          const current = html.dataset.theme;
          const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
          const next = current === 'dark' ? 'light' : current === 'light' ? '' : systemDark ? 'light' : 'dark';
          if (next) html.dataset.theme = next;
          else delete html.dataset.theme;
          try {
            if (next) localStorage.setItem('lazo-admin-theme', next);
            else localStorage.removeItem('lazo-admin-theme');
          } catch {}
        });

        // Mobile drawer.
        const shell = document.querySelector('#shell');
        const menuBtn = document.querySelector('#menu-btn');
        const setDrawer = (open) => {
          shell.classList.toggle('nav-open', open);
          menuBtn.setAttribute('aria-expanded', String(open));
        };
        menuBtn.addEventListener('click', () => setDrawer(!shell.classList.contains('nav-open')));
        document.querySelector('#scrim').addEventListener('click', () => setDrawer(false));
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') setDrawer(false);
        });

        const show = async (key) => {
          const section = sections[key] ?? Overview;
          const active = sections[key] ? key : 'overview';

          for (const button of nav.querySelectorAll('button')) {
            button.setAttribute('aria-current', String(button.dataset.section === active));
          }

          title.textContent = section.title;
          subtitle.textContent = section.subtitle;
          bodyEl.innerHTML = '<div class="spinner" role="status" aria-label="Loading"></div>';

          try {
            await section.render(bodyEl);
          } catch (failure) {
            bodyEl.replaceChildren(el(migrationNote(failure)));
          }
        };

        nav.addEventListener('click', (e) => {
          const button = e.target.closest('button[data-section]');
          if (!button) return;
          location.hash = button.dataset.section;
          setDrawer(false);
        });

        // The hash is the route, so a section is linkable and survives reload.
        window.addEventListener('hashchange', () => show(location.hash.slice(1)));

        const initial = location.hash.slice(1) || (location.pathname === '/keys' ? 'keys' : 'overview');
        if (!location.hash) history.replaceState(null, '', `#${initial}`);
        await show(initial);
        watchChats();
        streamChats();
      };

      try {
        const { publishableKey, configured } = await fetch('/api/auth/config').then((r) => r.json());

        if (!configured) {
          fatal(
            'Sign-in is not configured',
            'The server has no Clerk keys. Add CLERK_PUBLISHABLE_KEY and CLERK_SECRET_KEY to .env and restart.',
          );
        } else {
          await loadClerk(publishableKey);
          clerk = window.Clerk;
          await clerk.load({ clerkUICtor: window.__internal_ClerkUICtor });

          if (!clerk.user) {
            window.location.replace('/login');
          } else {
            await start();
          }
        }
      } catch (failure) {
        fatal('Something went wrong', failure.message);
      }
    </script>
  </body>
</html>
